<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="birthdayCake" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="birthdayGold" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="birthdayBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="birthdayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#birthdayBg)" stroke="#fecdd3" stroke-width="1.5"/>
  <g filter="url(#birthdayGlow)">
    <!-- Cake Base Stand -->
    <path d="M20 62 L60 62" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 62 L32 66 L48 66 L44 62" fill="#cbd5e1"/>
    <!-- Bottom Layer -->
    <rect x="23" y="44" width="34" height="17" rx="3" fill="url(#birthdayCake)"/>
    <path d="M23 48 Q28 52 32 48 Q37 52 41 48 Q46 52 50 48 Q54 52 57 48 L57 44 L23 44 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Top Layer -->
    <rect x="29" y="32" width="22" height="13" rx="2" fill="url(#birthdayGold)"/>
    <path d="M29 35 Q34 38 37 35 Q41 38 45 35 Q48 38 51 35 L51 32 L29 32 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Candles -->
    <line x1="35" y1="24" x2="35" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="22" x2="40" y2="32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="24" x2="45" y2="32" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <!-- Flames -->
    <path d="M35 19 Q36.5 22 35 24 Q33.5 22 35 19 Z" fill="#f59e0b"/>
    <path d="M40 17 Q41.5 20 40 22 Q38.5 20 40 17 Z" fill="#ef4444"/>
    <path d="M45 19 Q46.5 22 45 24 Q43.5 22 45 19 Z" fill="#f59e0b"/>
    <!-- Confetti / Party Sparkles -->
    <circle cx="19" cy="28" r="1.8" fill="#f43f5e"/>
    <circle cx="61" cy="30" r="2" fill="#38bdf8"/>
    <path d="M60 20 L61 22 L63 22 L61.5 23.5 L62 25.5 L60 24 L58 25.5 L58.5 23.5 L57 22 L59 22 Z" fill="#f59e0b"/>
  </g>
</svg>
