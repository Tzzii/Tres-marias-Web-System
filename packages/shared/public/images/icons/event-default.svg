<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="defaultGold" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#dfba73"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="defaultBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="defaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c5a059" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#defaultBg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <g filter="url(#defaultGlow)">
    <!-- Serving Cloche Handle -->
    <circle cx="40" cy="26" r="3.5" fill="url(#defaultGold)"/>
    <!-- Cloche Dome -->
    <path d="M22 48 C22 34 30 28 40 28 C50 28 58 34 58 48 Z" fill="url(#defaultGold)"/>
    <path d="M25 47 C26 36 32 31 40 31 C48 31 54 36 55 47 Z" fill="#ffffff" opacity="0.3"/>
    <!-- Cloche Platter Tray -->
    <rect x="18" y="49" width="44" height="4" rx="2" fill="#0f172a"/>
    <line x1="20" y1="55" x2="60" y2="55" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Delicate Steam / Flavor Essence -->
    <path d="M35 22 Q37 18 35 15" stroke="#c5a059" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M40 20 Q42 16 40 13" stroke="#c5a059" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M45 22 Q47 18 45 15" stroke="#c5a059" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
