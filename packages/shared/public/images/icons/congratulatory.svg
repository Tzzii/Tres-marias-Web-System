<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="congratGlass" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="congratBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="congratGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#congratBg)" stroke="#fde68a" stroke-width="1.5"/>
  <g filter="url(#congratGlow)">
    <!-- Left Flute -->
    <g transform="rotate(16 35 48)">
      <path d="M30 26 L40 26 L38 45 Q35 52 35 52 Q35 52 32 45 Z" fill="url(#congratGlass)" opacity="0.85"/>
      <line x1="35" y1="52" x2="35" y2="64" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="64" x2="42" y2="64" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Right Flute -->
    <g transform="rotate(-16 45 48)">
      <path d="M40 26 L50 26 L48 45 Q45 52 45 52 Q45 52 42 45 Z" fill="url(#congratGlass)" opacity="0.85"/>
      <line x1="45" y1="52" x2="45" y2="64" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="38" y1="64" x2="52" y2="64" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Clink Sparkle Center -->
    <path d="M40 18 L41.5 23 L46.5 24.5 L41.5 26 L40 31 L38.5 26 L33.5 24.5 L38.5 23 Z" fill="#f59e0b"/>
    <circle cx="40" cy="24.5" r="1.5" fill="#ffffff"/>
    <!-- Fizz Bubbles -->
    <circle cx="28" cy="20" r="2" fill="#fbbf24"/>
    <circle cx="52" cy="19" r="2.2" fill="#fbbf24"/>
    <circle cx="34" cy="14" r="1.5" fill="#f59e0b"/>
    <circle cx="47" cy="13" r="1.5" fill="#f59e0b"/>
    <!-- Celebration ribbons / stars -->
    <path d="M20 38 Q18 45 22 50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M60 38 Q62 45 58 50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
