<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <!-- Crisp Yellowish Outline Gradient -->
    <linearGradient id="yellowOutline" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Subtle Ambient Glow -->
    <filter id="yellowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#eab308" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean White Face with Yellowish Outline Only -->
  <circle cx="40" cy="40" r="34" fill="#ffffff" stroke="url(#yellowOutline)" stroke-width="3" filter="url(#yellowGlow)"/>

  <!-- Straight Neutral Eyebrows -->
  <line x1="23" y1="26" x2="33" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="26" x2="57" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neutral Slate Eyes -->
  <circle cx="28" cy="35" r="3.5" fill="#334155"/>
  <circle cx="52" cy="35" r="3.5" fill="#334155"/>

  <!-- Flat Expressionless Mouth Line -->
  <line x1="26" y1="52" x2="54" y2="52" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
</svg>
