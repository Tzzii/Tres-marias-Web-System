<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="partyGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="partyBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <filter id="partyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#partyBg)" stroke="#fbcfe8" stroke-width="1.5"/>
  <g filter="url(#partyGlow)">
    <!-- Party Popper Cone -->
    <path d="M22 62 L42 42 L24 36 Z" fill="url(#partyGrad)"/>
    <path d="M22 62 L42 42 L39 48 L22 62 Z" fill="#831843" opacity="0.3"/>
    <!-- Popper Rim -->
    <ellipse cx="33" cy="39" rx="10" ry="4" fill="#fbbf24" transform="rotate(-45 33 39)"/>
    <!-- Confetti & Streamers Bursts -->
    <path d="M38 34 Q45 25 54 28 T62 18" stroke="#ec4899" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M42 38 Q52 38 56 46 T64 42" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M35 30 Q42 16 50 16" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Stars & Dots -->
    <circle cx="58" cy="28" r="2.5" fill="#f59e0b"/>
    <circle cx="48" cy="32" r="2" fill="#8b5cf6"/>
    <circle cx="46" cy="22" r="2.2" fill="#10b981"/>
    <circle cx="64" cy="22" r="1.5" fill="#ef4444"/>
    <path d="M52 20 L53.5 24 L57.5 25 L53.5 26 L52 30 L50.5 26 L46.5 25 L50.5 24 Z" fill="#fbbf24"/>
  </g>
</svg>
