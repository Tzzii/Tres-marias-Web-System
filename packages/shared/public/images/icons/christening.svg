<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="chrisTeal" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="chrisGold" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="chrisBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="chrisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#chrisBg)" stroke="#99f6e4" stroke-width="1.5"/>
  <g filter="url(#chrisGlow)">
    <!-- Halo / Sunburst -->
    <circle cx="40" cy="24" r="10" stroke="url(#chrisGold)" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
    <!-- Flying Dove -->
    <path d="M40 24 C45 28 54 28 60 25 C58 32 50 36 45 36 C42 42 36 48 24 49 C28 44 31 38 33 34 C28 32 23 28 20 22 C28 24 35 28 38 30 Z" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Olive Branch in beak -->
    <path d="M40 24 Q44 20 48 19" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="44" cy="19" rx="2" ry="1" fill="#10b981" transform="rotate(-20 44 19)"/>
    <ellipse cx="47" cy="18" rx="2" ry="1" fill="#10b981" transform="rotate(10 47 18)"/>
    <!-- Baptismal Font / Water waves -->
    <path d="M22 56 Q31 52 40 56 Q49 60 58 56" stroke="url(#chrisTeal)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M26 62 Q33 58 40 62 Q47 66 54 62" stroke="url(#chrisTeal)" stroke-width="2" stroke-linecap="round" opacity="0.7" fill="none"/>
    <!-- Golden cross in font -->
    <path d="M40 46 L40 54 M37 49 L43 49" stroke="url(#chrisGold)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
