<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="otherGift" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="otherGold" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#dfba73"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="otherBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="otherGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#otherBg)" stroke="#ddd6fe" stroke-width="1.5"/>
  <g filter="url(#otherGlow)">
    <!-- Gift Box Body -->
    <rect x="23" y="43" width="34" height="20" rx="2.5" fill="url(#otherGift)"/>
    <rect x="25" y="45" width="8" height="16" rx="1.5" fill="#ffffff" opacity="0.14"/>
    <!-- Gift Box Lid -->
    <rect x="20" y="35" width="40" height="9" rx="2" fill="url(#otherGift)"/>
    <rect x="20" y="42.5" width="40" height="1.5" fill="#4c1d95" opacity="0.35"/>
    <!-- Ribbon -->
    <rect x="37" y="35" width="6" height="28" fill="url(#otherGold)"/>
    <!-- Bow -->
    <path d="M40 34 C35 25 26 26 28.5 31.5 C30 34.5 36 35 40 34 Z" fill="url(#otherGold)"/>
    <path d="M40 34 C45 25 54 26 51.5 31.5 C50 34.5 44 35 40 34 Z" fill="url(#otherGold)"/>
    <path d="M31 30.5 C33 29 36 30.5 38.5 33" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <circle cx="40" cy="34" r="2.8" fill="#c5a059"/>
    <!-- Sparkles: any celebration -->
    <path d="M18 19 Q18 24 23 24 Q18 24 18 29 Q18 24 13 24 Q18 24 18 19 Z" fill="#f59e0b"/>
    <path d="M62 15 Q62 19 66 19 Q62 19 62 23 Q62 19 58 19 Q62 19 62 15 Z" fill="#8b5cf6"/>
    <circle cx="63" cy="33" r="1.8" fill="#38bdf8"/>
    <circle cx="16" cy="40" r="1.6" fill="#f43f5e"/>
    <circle cx="65" cy="54" r="1.4" fill="#f59e0b"/>
  </g>
</svg>
