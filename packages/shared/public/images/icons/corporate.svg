<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="corpBlue" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="corpGold" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="corpBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="corpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#corpBg)" stroke="#bfdbfe" stroke-width="1.5"/>
  <g filter="url(#corpGlow)">
    <!-- Shield / Crest -->
    <path d="M40 20 L58 26 C58 44 48 56 40 62 C32 56 22 44 22 26 Z" fill="url(#corpBlue)"/>
    <path d="M40 23 L55 28 C55 43 46 53 40 59 C34 53 25 43 25 28 Z" fill="#1e3a8a" opacity="0.6"/>
    <!-- Executive Star Emblem inside -->
    <path d="M40 28 L42 34 L48 34.5 L43.5 38.5 L45 44 L40 40.5 L35 44 L36.5 38.5 L32 34.5 L38 34 Z" fill="url(#corpGold)"/>
    <!-- Professional Building Columns Accent -->
    <rect x="33" y="47" width="3" height="7" rx="1" fill="#93c5fd"/>
    <rect x="38.5" y="47" width="3" height="7" rx="1" fill="#93c5fd"/>
    <rect x="44" y="47" width="3" height="7" rx="1" fill="#93c5fd"/>
    <rect x="31" y="54" width="18" height="2" rx="0.5" fill="url(#corpGold)"/>
  </g>
</svg>
