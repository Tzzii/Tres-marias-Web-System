<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="weddingGold" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#dfba73"/>
      <stop offset="100%" stop-color="#9d7c38"/>
    </linearGradient>
    <linearGradient id="weddingBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="weddingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c5a059" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#weddingBg)" stroke="#fde68a" stroke-width="1.5"/>
  <g filter="url(#weddingGlow)">
    <!-- First Ring -->
    <circle cx="34" cy="46" r="16" stroke="url(#weddingGold)" stroke-width="4.5" fill="none"/>
    <!-- Second Ring (intertwined) -->
    <circle cx="48" cy="42" r="16" stroke="url(#weddingGold)" stroke-width="4.5" fill="none"/>
    <!-- Diamond Setting on left ring -->
    <path d="M34 23 L39 30 L29 30 Z" fill="#60a5fa" opacity="0.9"/>
    <path d="M34 23 L29 30 L34 33 L39 30 Z" stroke="#93c5fd" stroke-width="1" fill="#bfdbfe"/>
    <!-- Diamond Sparkle rays -->
    <path d="M34 16 L34 20 M27 21 L30 23 M41 21 L38 23" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Hearts / Sparkles -->
    <circle cx="58" cy="24" r="2" fill="#dfba73"/>
    <path d="M60 18 L61 21 L64 22 L61 23 L60 26 L59 23 L56 22 L59 21 Z" fill="#c5a059"/>
  </g>
</svg>
